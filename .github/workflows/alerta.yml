name: Notificacion NTFY

on:
  push:
    branches:
      - main

jobs:
  alerta:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Enviar notificacion
        run: |
          curl -H "Title: Nuevo Push" \
          -d "Repositorio: ${{ github.repository }} | Autor: ${{ github.actor }} | Commit: ${{ github.event.head_commit.message }}" \
          https://ntfy.sh/devops-itla